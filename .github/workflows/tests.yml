name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    # Without a limit, a hung run would go on until GitHub's 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The README gives setup steps for both.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      # The tests use simulated data, so CI never downloads the Hillstrom or Criteo files.
      - name: Unit tests
        run: python -m pytest -q
